<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数值吞噬 · 三关挑战</title>
  <style>
    /* 页面只做一件事：让游戏画布居中、铺满窗口、不留滚动条 */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0b0e14;
      overflow: hidden;
    }
    #game-root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <!-- Phaser 会把画布塞进这个容器里 -->
  <div id="game-root"></div>

  <!-- ===== 1. Phaser 引擎（CDN，无需安装任何东西） ===== -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <!-- ===== 2. 配置与工具（常量、小函数、存档） ===== -->
  <script src="src/config.js?v=5"></script>

  <!-- ===== 3. 实体类（玩家、怪物、道具） ===== -->
  <script src="src/entities.js?v=5"></script>

  <!-- ===== 4. 四个场景（顺序：启动 → 菜单 → 游戏 → 结算） ===== -->
  <script src="src/scenes/BootScene.js?v=5"></script>
  <script src="src/scenes/MenuScene.js?v=5"></script>
  <script src="src/scenes/GameScene.js?v=5"></script>
  <script src="src/scenes/ResultScene.js?v=5"></script>

  <!-- ===== 5. 入口文件必须放最后（它要读取上面所有的场景类） ===== -->
  <script src="src/main.js?v=5"></script>
</body>
</html>
